<!DOCTYPE html>

<head>

    <!-- ฟอนต์ไทย: Charm (หัวเรื่อง) + Noto Sans Thai (เนื้อความ) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { mystic: '#1a1025', gold: '#D69E2E', accent: '#9F7AEA' } } } }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-white min-h-screen flex flex-col">
    <header class="site-header p-4 flex justify-between items-center">
        <nav>
            <a href="index.html" class="back-link touch-target">← กลับ</a>
        </nav>
        <h1 class="text-2xl font-bold brand-title">ไพ่ประจำวัน</h1>
        <div class="w-10"></div> <!-- spacer -->
    </header>

    <main class="flex-grow p-4 flex flex-col items-center max-w-md mx-auto w-full pb-10">
        <!-- วันที่แบบไทย -->
        <div class="chip mb-5">🌙 <span id="daily-date">กำลังโหลด...</span></div>
        
        <!-- ไพ่ประจำวัน -->
        <article id="card-display" class="card-placeholder mb-6 shadow-lg shadow-accent/20">
            <div class="card-number" id="card-number">-</div>
            <div class="card-symbol" id="card-symbol">?</div>
            <div class="card-title" id="card-title">กำลังสับไพ่...</div>
        </article>

        <section class="w-full space-y-5 text-left">
            <div class="panel p-5">
                <h2 class="text-xl section-title mb-3">ข้อความประจำวัน</h2>
                <p class="text-gray-300 italic leading-relaxed" id="daily-message">"กำลังแปลผลไพ่..."</p>
            </div>
            
            <!-- พลังงานรายด้าน -->
            <h3 class="text-xl section-title pb-1 mt-6">พลังงานในแต่ละด้าน</h3>
            
            <div id="energy-container" class="space-y-4">
                <!-- Dynamically populated by JS -->
            </div>
            
            <nav class="mt-6">
                <a href="reading.html" class="block w-full text-center btn-outline-gold py-3 px-6 touch-target">ดูไพ่ส่วนตัวเพิ่มเติม 🔮</a>
            </nav>
        </section>

        <!-- AdSense Placeholder -->
        <div class="w-full ad-slot text-center py-4 my-6 text-sm" aria-label="Advertisement">
            AdSense Banner (Responsive)
        </div>

        <!-- Debug Section -->
        <section id="debug-section" class="hidden mt-8 w-full bg-black/50 p-4 border border-red-500 text-xs font-mono text-gray-400 rounded-lg overflow-x-auto break-all">
        </section>
    </main>

    <footer class="p-4 text-center border-t border-gold/15 text-xs text-gray-500 mt-auto">
        <p>&copy; 2026 Thai Tarot.</p>
    </footer>

    <script type="module" src="js/daily-page.js"></script>
</body>
</html>
